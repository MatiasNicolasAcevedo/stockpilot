# Origen público de StockPilot (servicio client): sirve la SPA compilada y reenvía al server las rutas de API y de
# login, para que la cookie de sesión y el CSRF funcionen sin CORS. Las rutas deben coincidir con el proxy de
# vite.config.ts (desarrollo con HMR).
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # DNS interno de Docker con TTL corto: si el contenedor server se recrea (rebuild) cambia de IP y el client
    # no necesita reiniciarse. Con proxy_pass por variable, nginx no falla al arrancar si server aún no resuelve.
    # Con server detenido, el DNS de Docker tarda ~4 s en fallar; 1 s acota la espera antes del 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 1s;
    set $server_upstream http://server:8080;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /api/**, /oauth2/**, /login/oauth2/code/** y /logout → server, con la URI original intacta.
    location ~ ^/(?:(?:api|oauth2|login/oauth2/code)/|logout$) {
        proxy_pass $server_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # Recursos con hash en el nombre: cache larga.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Rutas del router del navegador: siempre index.html, sin cache para tomar cada despliegue.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
