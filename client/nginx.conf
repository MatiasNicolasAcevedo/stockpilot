# Origen público de StockPilot (servicio client): sirve la SPA compilada y reenvía al server las rutas de API y de
# login, para que la cookie de sesión y el CSRF funcionen sin CORS. Las rutas deben coincidir con el proxy de
# vite.config.ts (desarrollo con HMR).
map $http_host $stockpilot_host_allowed {
    default 0;
    "${PUBLIC_AUTHORITY}" 1;
    ${PUBLIC_AUTHORITY_ALIAS}
}

# Never log auth query parameters (code/state), cookies or attacker-provided forwarding metadata.
log_format stockpilot_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log stockpilot_safe;
    if ($stockpilot_host_allowed = 0) { return 400; }

    # DNS interno de Docker con TTL corto: si el contenedor server se recrea (rebuild) cambia de IP y el client
    # no necesita reiniciarse. Con proxy_pass por variable, nginx no falla al arrancar si server aún no resuelve.
    # Este timeout solo acota DNS; la conexión a una IP ya resuelta tiene su propio límite en el proxy.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 1s;
    set $server_upstream http://server:8080;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /api/**, /oauth2/**, /login/oauth2/code/** y /logout → server, con la URI original intacta.
    location ~ ^/(?:(?:api|oauth2|login/oauth2/code)/|logout$) {
        proxy_pass $server_upstream;
        # Si server cae después de resolverlo, no esperar el timeout TCP del SO hacia la IP anterior.
        proxy_connect_timeout 1s;
        proxy_http_version 1.1;
        # An allowlist removes EVERY incoming Forwarded/X-Forwarded-* (including unknown extensions).
        # Keep the cookie/CSRF/body contract, reconstruct forwarding exclusively from config and peer.
        proxy_pass_request_headers off;
        proxy_set_header Host "${PUBLIC_AUTHORITY}";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-XSRF-TOKEN $http_x_xsrf_token;
        proxy_set_header Accept $http_accept;
        proxy_set_header Accept-Language $http_accept_language;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Content-Length $http_content_length;
        proxy_set_header Origin $http_origin;
        proxy_set_header Referer $http_referer;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header If-None-Match $http_if_none_match;
        proxy_set_header If-Modified-Since $http_if_modified_since;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto "${PUBLIC_SCHEME}";
        proxy_set_header X-Forwarded-Host "${PUBLIC_AUTHORITY}";
        proxy_set_header X-Forwarded-Port "${PUBLIC_PORT}";
    }

    # Recursos con hash en el nombre: cache larga.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Rutas del router del navegador: siempre index.html, sin cache para tomar cada despliegue.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
