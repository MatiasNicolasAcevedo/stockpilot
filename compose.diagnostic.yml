# Explicit direct loopback diagnosis, never a second trusted proxy entrance.
# docker compose -f docker-compose.yml -f compose.diagnostic.yml up -d --build --wait db server
services:
  server:
    environment:
      SERVER_FORWARD_HEADERS_STRATEGY: none
      APP_PUBLIC_URL: http://127.0.0.1:${DIAGNOSTIC_SERVER_PORT:-8080}
    ports:
      - "127.0.0.1:${DIAGNOSTIC_SERVER_PORT:-8080}:8080"
